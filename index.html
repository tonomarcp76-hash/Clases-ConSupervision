<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clases con Supervisión — Video Llamada Completa</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #1a1a2e; color: white; min-height: 100vh; padding: 20px; }
        h1 { text-align: center; margin-bottom: 20px; color: #00f5d4; }
        
        /* PANTALLA DE SELECCIÓN */
        .pantalla-roles { display: flex; justify-content: center; align-items: center; min-height: 80vh; gap: 30px; flex-wrap: wrap; }
        .tarjeta-rol { background: #16213e; border-radius: 16px; padding: 40px; width: 280px; text-align: center; cursor: pointer; transition: all 0.3s; box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .tarjeta-rol:hover { transform: scale(1.05); }
        .tarjeta-rol.profesor { border: 3px solid #ffd700; }
        .tarjeta-rol.alumno { border: 3px solid #00f5d4; }
        .icono { font-size: 60px; margin-bottom: 20px; }
        .tarjeta-rol h3 { font-size: 22px; margin-bottom: 10px; }
        .tarjeta-rol p { color: #aaa; font-size: 14px; }

        /* PANTALLA PRINCIPAL */
        .pantalla-principal { display: none; }
        .estado-conexion { text-align: center; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; }
        .estado-verde { background: #004d40; color: #fff; }
        .estado-rojo { background: #4a0000; color: #ff9999; }
        .estado-amarillo { background: #5c4a00; color: #fff; }

        .grid-video { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .caja-video { background: #16213e; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .etiqueta { display: inline-block; padding: 6px 16px; border-radius: 20px; font-weight: bold; margin-bottom: 15px; font-size: 14px; }
        .etiqueta-profesor { background: #ffd700; color: #000; }
        .etiqueta-alumno { background: #00f5d4; color: #000; }
        video { width: 100%; border-radius: 8px; background: #000; min-height: 280px; transform: scaleX(-1); margin-bottom: 15px; }
        #videoRemoto { transform: none; }
        .sin-video { display: flex; align-items: center; justify-content: center; color: #888; font-size: 16px; height: 280px; }

        .botones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .btn { padding: 12px 18px; font-size: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .btn:hover { transform: scale(1.02); }
        .btn-amarillo { background: #ffd700; color: #000; }
        .btn-verde { background: #00f5d4; color: #000; }
        .btn-azul { background: #2196f3; color: white; }
        .btn-rojo { background: #e94560; color: white; }
        .btn-salir { position: fixed; top: 15px; right: 15px; background: #e94560; color: white; z-index: 100; }

        /* CHAT */
        .caja-chat { background: #16213e; border-radius: 12px; padding: 20px; margin-top: 20px; }
        .mensajes { height: 200px; overflow-y: auto; background: #0f3460; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .mensaje { margin-bottom: 12px; padding: 10px 14px; border-radius: 18px; max-width: 80%; line-height: 1.4; }
        .mensaje-propio { background: #00f5d4; color: #000; margin-left: auto; border-bottom-right-radius: 4px; }
        .mensaje-otro { background: #2a3f5f; color: white; margin-right: auto; border-bottom-left-radius: 4px; }
        .mensaje .hora { font-size: 11px; opacity: 0.7; margin-top: 5px; }
        .entrada-chat { display: flex; gap: 10px; }
        #inputMensaje { flex: 1; padding: 14px; border-radius: 8px; border: none; background: #0f3460; color: white; font-size: 15px; }

        @media (max-width: 900px) {
            .grid-video { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <button class="btn btn-salir" onclick="salir()">🚪 Salir</button>

    <!-- PANTALLA SELECCIÓN DE ROL -->
    <div class="pantalla-roles" id="pantallaRoles">
        <div class="tarjeta-rol profesor" onclick="entrarComo('profesor')">
            <div class="icono">👨‍🏫</div>
            <h3>Profesor</h3>
            <p>Ver alumno, compartir pantalla, chatear</p>
        </div>
        <div class="tarjeta-rol alumno" onclick="entrarComo('alumno')">
            <div class="icono">👨‍🎓</div>
            <h3>Alumno</h3>
            <p>Ver profesor, recibir clase, chatear</p>
        </div>
    </div>

    <!-- PANTALLA CLASE EN VIVO -->
    <div class="pantalla-principal" id="pantallaPrincipal">
        <h1>📹 Clase en Vivo — <span id="nombreRol"></span></h1>
        
        <div class="estado-conexion estado-rojo" id="estadoConexion">
            🔴 Esperando conexión...
        </div>

        <div class="grid-video">
            <!-- TU CÁMARA -->
            <div class="caja-video">
                <span class="etiqueta" id="etiquetaTu">Tu cámara</span>
                <video id="videoLocal" autoplay playsinline muted></video>
                <div class="botones">
                    <button class="btn btn-amarillo" onclick="activarMiCamara()">📷 Activar Cámara</button>
                    <button class="btn btn-azul" onclick="compartirPantalla()">🖥️ Compartir Pantalla</button>
                    <button class="btn btn-rojo" onclick="detenerTodo()">🛑 Parar</button>
                </div>
            </div>

            <!-- CÁMARA DEL OTRO -->
            <div class="caja-video">
                <span class="etiqueta etiqueta-alumno" id="etiquetaOtro">Cámara del otro</span>
                <video id="videoRemoto" autoplay playsinline class="sin-video">
                    <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#666;">📹 Esperando video...</div>
                </video>
                <div class="botones">
                    <span id="estadoVideo" style="color:#888; padding:10px;">⏳ Sin conexión de video</span>
                </div>
            </div>
        </div>

        <!-- CHAT -->
        <div class="caja-chat">
            <h2>💬 Chat en tiempo real</h2>
            <div class="mensajes" id="cajaMensajes">
                <div style="text-align:center; color:#888; padding:20px;">✅ Conectado. Escribe un mensaje ✍️</div>
            </div>
            <div class="entrada-chat">
                <input type="text" id="inputMensaje" placeholder="Escribe tu mensaje..." onkeypress="if(event.key === 'Enter') enviarMensaje()">
                <button class="btn btn-verde" onclick="enviarMensaje()">📤 Enviar</button>
            </div>
        </div>
    </div>

    <script>
        // ===== FIREBASE =====
        const firebaseConfig = {
            apiKey: "AIZaSyCFWxrLP77QblShCdUvjuDbg-X98yfyAo",
            authDomain: "clases-consupervision.firebaseapp.com",
            projectId: "clases-consupervision",
            storageBucket: "clases-consupervision.appspot.com",
            messagingSenderId: "125682581947",
            appId: "1:125682581947:web:e93e303b30b6979924849e",
            measurementId: "G-3MMT4ZWQJW"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ===== SERVIDORES PARA CONECTAR CÁMARAS =====
        const servidoresICE = {
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" },
                { urls: "stun:stun2.l.google.com:19302" }
            ]
        };

        let miRol = null;
        let miId = null;
        let otroId = null;
        let miStream = null;
        let conexion = null;
        let compartiendoPantalla = false;
        let mensajesRef = null;
        let señalesRef = null;
        let estadoRef = null;
        let yaOfreci = false;
        let yaRespondi = false;

        // ===== ENTRAR COMO ROL =====
        function entrarComo(rol) {
            miRol = rol;
            miId = rol;
            otroId = rol === 'profesor' ? 'alumno' : 'profesor';

            document.getElementById('pantallaRoles').style.display = 'none';
            document.getElementById('pantallaPrincipal').style.display = 'block';
            document.getElementById('nombreRol').textContent = rol === 'profesor' ? '👨‍🏫 Profesor' : '👨‍🎓 Alumno';

            // Etiquetas visuales
            document.getElementById('etiquetaTu').className = 
                rol === 'profesor' ? 'etiqueta etiqueta-profesor' : 'etiqueta etiqueta-alumno';
            document.getElementById('etiquetaTu').textContent = 
                rol === 'profesor' ? '👨‍🏫 Mi Cámara' : '👨‍🎓 Mi Cámara';
            document.getElementById('etiquetaOtro').className = 
                rol === 'profesor' ? 'etiqueta etiqueta-alumno' : 'etiqueta etiqueta-profesor';
            document.getElementById('etiquetaOtro').textContent = 
                rol === 'profesor' ? '👨‍🎓 Cámara del Alumno' : '👨‍🏫 Cámara del Profesor';

            // Referencias en Firebase
            mensajesRef = db.ref('clase_v2/mensajes');
            señalesRef = db.ref('clase_v2/señales');
            estadoRef = db.ref('clase_v2/estado');

            // Anunciar que estoy aquí
            estadoRef.child(miId).set({ conectado: true, tiempo: Date.now() });

            // Escuchar si el otro está conectado
            estadoRef.child(otroId).on('value', (snap) => {
                const datos = snap.val();
                if (datos && datos.conectado) {
                    actualizarEstadoConexion('conectado');
                } else {
                    actualizarEstadoConexion('desconectado');
                }
            });

            // ESCUCHAR SEÑALES DE VIDEO — EL CORAZÓN DE LA CONEXIÓN
            señalesRef.on('value', async (snap) => {
                const datos = snap.val();
                if (!datos) return;

                try {
                    // 1️⃣ RECIBO UNA OFERTA DEL OTRO
                    if (datos.oferta && !yaRespondi) {
                        crearConexionSiNoHay();
                        await conexion.setRemoteDescription(new RTCSessionDescription(datos.oferta));
                        
                        // Le mando MI RESPUESTA de vuelta
                        const respuesta = await conexion.createAnswer();
                        await conexion.setLocalDescription(respuesta);
                        yaRespondi = true;
                        
                        señalesRef.update({ respuesta: respuesta });
                        console.log('✅ Envié respuesta de conexión');
                    }

                    // 2️⃣ RECIBO LA RESPUESTA A MI OFERTA
                    if (datos.respuesta && yaOfreci && conexion && !conexion.remoteDescription) {
                        await conexion.setRemoteDescription(new RTCSessionDescription(datos.respuesta));
                        console.log('✅ Recibí respuesta — conexión establecida');
                    }

                    // 3️⃣ RECIBO DIRECCIONES PARA CONECTAR
                    if (datos.candidato && conexion) {
                        await conexion.addIceCandidate(new RTCIceCandidate(datos.candidato));
                    }
                } catch (e) {
                    console.log('Error procesando señal:', e);
                }
            });

            // Escuchar mensajes del chat
            mensajesRef.on('child_added', (snap) => {
                const msg = snap.val();
                if (!msg.visto) {
                    mostrarMensaje(msg);
                    snap.ref.update({ visto: true });
                }
            });

            agregarMsgSistema(`✅ ${miRol === 'profesor' ? 'Profesor' : 'Alumno'} se ha conectado`);
        }

        function actualizarEstadoConexion(estado) {
            const caja = document.getElementById('estadoConexion');
            if (estado === 'conectado') {
                caja.className = 'estado-conexion estado-verde';
                caja.textContent = `🟢 ${otroId === 'alumno' ? 'Alumno' : 'Profesor'} está conectado — ¡Activa tu cámara!`;
            } else {
                caja.className = 'estado-conexion estado-rojo';
                caja.textContent = `🔴 Esperando que se conecte el ${otroId === 'alumno' ? 'Alumno' : 'Profesor'}...`;
            }
        }

        // ===== CREAR LA CONEXIÓN DE VIDEO =====
        function crearConexionSiNoHay() {
            if (conexion) return;

            conexion = new RTCPeerConnection(servidoresICE);

            // 📹 CUANDO RECIBA EL VIDEO DEL OTRO → LO MUESTRO
            conexion.ontrack = (evento) => {
                console.log('📹 ¡Recibí video del otro!');
                const videoRemoto = document.getElementById('videoRemoto');
                videoRemoto.classList.remove('sin-video');
                videoRemoto.srcObject = evento.streams[0];
                document.getElementById('estadoVideo').textContent = '🟢 ¡Conectado y viéndose!';
                agregarMsgSistema('📹 ¡Conexión de video exitosa! Ya se ven mutuamente');
            };

            // 📡 CUANDO TENGA MI INFORMACIÓN DE CONEXIÓN → LA COMPARTO
            conexion.onicecandidate = (evento) => {
                if (evento.candidate) {
                    señalesRef.child('candidato').set(evento.candidate.toJSON());
                }
            };

            // 🔄 CAMBIOS DE ESTADO
            conexion.onconnectionstatechange = () => {
                const estado = conexion.connectionState;
                console.log('🔄 Estado conexión:', estado);
                
                if (estado === 'connected') {
                    document.getElementById('estadoVideo').textContent = '🟢 Conectado — ¡Viéndonos!';
                } else if (estado === 'connecting') {
                    document.getElementById('estadoVideo').textContent = '🟡 Conectando video...';
                } else if (estado === 'disconnected' || estado === 'failed') {
                    document.getElementById('estadoVideo').textContent = '🔴 Conexión perdida';
                }
            };

            // Si ya tengo mi cámara activa → la agrego a la conexión
            if (miStream) {
                miStream.getTracks().forEach(pista => {
                    conexion.addTrack(pista, miStream);
                });
            }
        }

        // 📷 ACTIVAR MI CÁMARA
        async function activarMiCamara() {
            try {
                miStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 1280, height: 720 },
                    audio: true
                });

                // Mostrar mi cámara
                document.getElementById('videoLocal').srcObject = miStream;
                agregarMsgSistema('📷 Cámara activada');

                // Crear conexión y agregar mi video
                crearConexionSiNoHay();
                miStream.getTracks().forEach(pista => {
                    conexion.addTrack(pista, miStream);
                });

                // ⚡ EL PRIMERO EN CONECTARSE ESPERA — EL SEGUNDO INICIA LA OFERTA
                // Si soy el PROFESOR y el ALUMNO ya está conectado → YO INICIO
                // Si soy el ALUMNO → YO INICIO SIEMPRE (porque llegué segundo)
                estadoRef.child(otroId).once('value', async (snap) => {
                    const otroExiste = snap.exists() && snap.val()?.conectado;
                    
                    if ((miId === 'alumno' || otroExiste) && !yaOfreci) {
                        await crearOfertaConexion();
                    }
                });

            } catch (e) {
                alert('❌ Error con la cámara: ' + e.message + '\n⚠️ Asegúrate de dar permiso a la cámara y micrófono.');
            }
        }

        // 📤 ENVIAR OFERTA DE CONEXIÓN AL OTRO
        async function crearOfertaConexion() {
            if (yaOfreci) return;
            yaOfreci = true;

            crearConexionSiNoHay();
            const oferta = await conexion.createOffer();
            await conexion.setLocalDescription(oferta);
            
            await señalesRef.child('oferta').set(oferta.toJSON());
            document.getElementById('estadoVideo').textContent = '📤 Enviando solicitud de video...';
            console.log('📤 Oferta enviada al otro participante');
        }

        // 🖥️ COMPARTIR PANTALLA
        async function compartirPantalla() {
            try {
                if (compartiendoPantalla) {
                    detenerPantallaCompartida();
                    return;
                }

                const pantalla = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: 'always' },
                    audio: true
                });

                document.getElementById('videoLocal').srcObject = pantalla;
                compartiendoPantalla = true;

                // Reemplazar mi video por la pantalla en la conexión
                if (conexion) {
                    const emisor = conexion.getSenders().find(s => s.track?.kind === 'video');
                    if (emisor) {
                        await emisor.replaceTrack(pantalla.getVideoTracks()[0]);
                    }
                }

                agregarMsgSistema('🖥️ Pantalla compartida — ¡El alumno la ve!');

                pantalla.getVideoTracks()[0].onended = () => {
                    detenerPantallaCompartida();
                };

            } catch (e) {
                alert('❌ No se pudo compartir pantalla: ' + e.message);
            }
        }

        async function detenerPantallaCompartida() {
            compartiendoPantalla = false;
            if (miStream) {
                document.getElementById('videoLocal').srcObject = miStream;
                if (conexion) {
                    const emisor = conexion.getSenders().find(s => s.track?.kind === 'video');
                    if (emisor) {
                        await emisor.replaceTrack(miStream.getVideoTracks()[0]);
                    }
                }
            }
            agregarMsgSistema('🖥️ Pantalla dejada de compartir');
        }

        function detenerTodo() {
            if (miStream) miStream.getTracks().forEach(t => t.stop());
            miStream = null;
            document.getElementById('videoLocal').srcObject = null;
            document.getElementById('videoRemoto').srcObject = null;
            document.getElementById('videoRemoto').classList.add('sin-video');
            if (conexion) conexion.close();
            conexion = null;
            yaOfreci = false;
            yaRespondi = false;
            señalesRef?.remove();
            agregarMsgSistema('🛑 Todo detenido');
        }

        // 💬 CHAT
        function enviarMensaje() {
            const texto = document.getElementById('inputMensaje').value.trim();
            if (!texto) return;
            const hora = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
            mensajesRef.push({ de: miId, texto: texto, hora: hora, visto: false });
            document.getElementById('inputMensaje').value = '';
        }

        function mostrarMensaje(msg) {
            const caja = document.getElementById('cajaMensajes');
            const esMio = msg.de === miId;
            const div = document.createElement('div');
            div.className = `mensaje ${esMio ? 'mensaje-propio' : 'mensaje-otro'}`;
            div.innerHTML = `<strong>${msg.de === 'profesor' ? '👨‍🏫 Profesor' : '👨‍🎓 Alumno'}:</strong> ${msg.texto}<div class="hora">${msg.hora}</div>`;
            caja.appendChild(div);
            caja.scrollTop = caja.scrollHeight;
        }

        function agregarMsgSistema(texto) {
            const caja = document.getElementById('cajaMensajes');
            const div = document.createElement('div');
            div.style.textAlign = 'center';
            div.style.color = '#888';
            div.style.fontSize = '13px';
            div.style.margin = '8px 0';
            div.textContent = `— ${texto} —`;
            caja.appendChild(div);
            caja.scrollTop = caja.scrollHeight;
        }

        function salir() {
            if (confirm('¿Seguro quieres salir?')) {
                detenerTodo();
                estadoRef?.child(miId)?.set({ conectado: false });
                window.location.reload();
            }
        }
    </script>
</body>
</html>

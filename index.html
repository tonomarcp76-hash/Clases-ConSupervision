<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clase en Vivo — Video + Audio</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #1a1a2e; color: white; min-height: 100vh; padding: 20px; }
        h1 { text-align: center; margin-bottom: 20px; color: #00f5d4; }
        
        /* SELECCIÓN DE ROL */
        .seleccion-rol { display: flex; justify-content: center; align-items: center; min-height: 80vh; gap: 30px; flex-wrap: wrap; }
        .tarjeta { background: #16213e; border-radius: 16px; padding: 40px; width: 280px; text-align: center; cursor: pointer; transition: all 0.3s; box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .tarjeta:hover { transform: scale(1.05); }
        .tarjeta.profesor { border: 3px solid #ffd700; }
        .tarjeta.alumno { border: 3px solid #00f5d4; }
        .icono { font-size: 60px; margin-bottom: 20px; }
        .tarjeta h3 { font-size: 22px; margin-bottom: 10px; }
        .tarjeta p { color: #aaa; font-size: 14px; }

        /* PANTALLA PRINCIPAL */
        .pantalla-clase { display: none; }
        .barra-estado { text-align: center; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; }
        .estado-conectado { background: #004d40; color: #fff; }
        .estado-esperando { background: #5c4a00; color: #fff; }
        .estado-desconectado { background: #4a0000; color: #ff9999; }

        .grid-camaras { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .caja-camara { background: #16213e; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .etiqueta { display: inline-block; padding: 6px 16px; border-radius: 20px; font-weight: bold; margin-bottom: 15px; font-size: 14px; }
        .etiqueta-profesor { background: #ffd700; color: #000; }
        .etiqueta-alumno { background: #00f5d4; color: #000; }
        video { width: 100%; border-radius: 8px; background: #000; min-height: 280px; transform: scaleX(-1); margin-bottom: 15px; }
        #videoOtro { transform: none; }
        .sin-video { display: flex; align-items: center; justify-content: center; color: #888; font-size: 16px; height: 280px; }

        .fila-botones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .btn { padding: 12px 18px; font-size: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .btn:hover { transform: scale(1.02); }
        .btn-amarillo { background: #ffd700; color: #000; }
        .btn-verde { background: #00f5d4; color: #000; }
        .btn-azul { background: #2196f3; color: white; }
        .btn-gris { background: #555; color: white; }
        .btn-rojo { background: #e94560; color: white; }
        .btn-salir { position: fixed; top: 15px; right: 15px; background: #e94560; color: white; z-index: 100; }

        .indicador { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; background: #2a2a4a; font-size: 13px; margin-left: 10px; }
        .activo { background: #004d40; color: #fff; }

        /* CHAT */
        .caja-chat { background: #16213e; border-radius: 12px; padding: 20px; margin-top: 20px; }
        .mensajes { height: 200px; overflow-y: auto; background: #0f3460; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .mensaje { margin-bottom: 12px; padding: 10px 14px; border-radius: 18px; max-width: 80%; line-height: 1.4; }
        .mensaje-propio { background: #00f5d4; color: #000; margin-left: auto; border-bottom-right-radius: 4px; }
        .mensaje-otro { background: #2a3f5f; color: white; margin-right: auto; border-bottom-left-radius: 4px; }
        .entrada-chat { display: flex; gap: 10px; }
        #entradaMensaje { flex: 1; padding: 14px; border-radius: 8px; border: none; background: #0f3460; color: white; font-size: 15px; }

        @media (max-width: 900px) {
            .grid-camaras { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <button class="btn btn-salir" onclick="salir()">🚪 Salir</button>

    <!-- SELECCIÓN DE ROL -->
    <div class="seleccion-rol" id="pantallaSeleccion">
        <div class="tarjeta profesor" onclick="entrar('profesor')">
            <div class="icono">👨‍🏫</div>
            <h3>Profesor</h3>
            <p>Ver y escuchar alumno, compartir pantalla</p>
        </div>
        <div class="tarjeta alumno" onclick="entrar('alumno')">
            <div class="icono">👨‍🎓</div>
            <h3>Alumno</h3>
            <p>Ver y escuchar profesor, recibir clase</p>
        </div>
    </div>

    <!-- PANTALLA DE CLASE -->
    <div class="pantalla-clase" id="pantallaClase">
        <h1>📹🎤 Clase en Vivo — <span id="miRolTexto"></span></h1>
        
        <div class="barra-estado estado-esperando" id="barraEstado">
            ⏳ Esperando conexión...
        </div>

        <div class="grid-camaras">
            <!-- MI CÁMARA -->
            <div class="caja-camara">
                <div style="display:flex;align-items:center;flex-wrap:wrap;margin-bottom:15px;">
                    <span class="etiqueta" id="miEtiqueta">Mi Cámara</span>
                    <span class="indicador" id="miAudioEstado">🎤 Mic: ⏳</span>
                </div>
                <video id="miVideo" autoplay playsinline muted></video>
                <div class="fila-botones">
                    <button class="btn btn-amarillo" onclick="iniciarCamaraAudio()">📷🎤 Activar Cámara y Micrófono</button>
                    <button class="btn btn-azul" onclick="compartirPantalla()">🖥️ Compartir Pantalla</button>
                    <button class="btn btn-gris" id="btnSilenciar" onclick="alternarMicrofono()">🔇 Silenciar</button>
                    <button class="btn btn-rojo" onclick="detenerTodo()">🛑 Parar</button>
                </div>
            </div>

            <!-- CÁMARA DEL OTRO -->
            <div class="caja-camara">
                <div style="display:flex;align-items:center;flex-wrap:wrap;margin-bottom:15px;">
                    <span class="etiqueta etiqueta-alumno" id="etiquetaOtro">Cámara del Otro</span>
                    <span class="indicador" id="audioOtroEstado">🔊 Audio: ⏳</span>
                </div>
                <video id="videoOtro" autoplay playsinline class="sin-video"></video>
                <div class="fila-botones">
                    <span id="estadoConexionVideo" style="color:#888; padding:10px;">📹 Esperando conexión de video...</span>
                </div>
            </div>
        </div>

        <!-- CHAT -->
        <div class="caja-chat">
            <h2>💬 Chat en tiempo real</h2>
            <div class="mensajes" id="cajaMensajes">
                <div style="text-align:center; color:#888; padding:20px;">✅ Conectado. Escribe un mensaje ✍️</div>
            </div>
            <div class="entrada-chat">
                <input type="text" id="entradaMensaje" placeholder="Escribe tu mensaje..." onkeypress="if(event.key === 'Enter') enviarMensaje()">
                <button class="btn btn-verde" onclick="enviarMensaje()">📤 Enviar</button>
            </div>
        </div>
    </div>

    <script>
        // ===== FIREBASE =====
        const firebaseConfig = {
            apiKey: "AIZaSyCFWxrLP77QblShCdUvjuDbg-X98yfyAo",
            authDomain: "clases-consupervision.firebaseapp.com",
            projectId: "clases-consupervision",
            storageBucket: "clases-consupervision.appspot.com",
            messagingSenderId: "125682581947",
            appId: "1:125682581947:web:e93e303b30b6979924849e",
            measurementId: "G-3MMT4ZWQJW"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ===== SERVIDORES DE CONEXIÓN =====
        const servidoresICE = {
            iceServers: [
                { urls: "stun:stun.l.google.com:19302" },
                { urls: "stun:stun1.l.google.com:19302" },
                { urls: "stun:stun2.l.google.com:19302" },
                { urls: "stun:stun3.l.google.com:19302" }
            ]
        };

        let miRol = null;
        let miId = null;
        let otroId = null;
        let miStream = null;
        let conexion = null;
        let compartiendoPantalla = false;
        let microfonoSilenciado = false;
        let mensajesRef = null;
        let señalesRef = null;
        let estadoRef = null;
        let yaOfreci = false;

        // ===== ENTRAR COMO ROL =====
        function entrar(rol) {
            miRol = rol;
            miId = rol;
            otroId = rol === 'profesor' ? 'alumno' : 'profesor';

            document.getElementById('pantallaSeleccion').style.display = 'none';
            document.getElementById('pantallaClase').style.display = 'block';
            document.getElementById('miRolTexto').textContent = rol === 'profesor' ? '👨‍🏫 Profesor' : '👨‍🎓 Alumno';

            // Etiquetas visuales
            document.getElementById('miEtiqueta').className = 
                rol === 'profesor' ? 'etiqueta etiqueta-profesor' : 'etiqueta etiqueta-alumno';
            document.getElementById('miEtiqueta').textContent = 
                rol === 'profesor' ? '👨‍🏫 Mi Cámara' : '👨‍🎓 Mi Cámara';
            document.getElementById('etiquetaOtro').className = 
                rol === 'profesor' ? 'etiqueta etiqueta-alumno' : 'etiqueta etiqueta-profesor';
            document.getElementById('etiquetaOtro').textContent = 
                rol === 'profesor' ? '👨‍🎓 Cámara del Alumno' : '👨‍🏫 Cámara del Profesor';

            // RUTA NUEVA Y LIMPIA para evitar conflictos con datos viejos
            const rutaSesion = 'sesion_' + Date.now();
            mensajesRef = db.ref(rutaSesion + '/mensajes');
            señalesRef = db.ref(rutaSesion + '/señales');
            estadoRef = db.ref(rutaSesion + '/estado');

            // Anunciar que estoy aquí
            estadoRef.child(miId).set({ conectado: true, tiempo: Date.now() });

            // Escuchar si el otro está conectado
            estadoRef.child(otroId).on('value', (snap) => {
                const datos = snap.val();
                if (datos && datos.conectado) {
                    actualizarEstado('conectado');
                } else {
                    actualizarEstado('esperando');
                }
            });

            // ===== ESCUCHAR SEÑALES — LÓGICA SIMPLIFICADA =====
            señalesRef.on('value', async (snap) => {
                const datos = snap.val();
                if (!datos) return;

                try {
                    // 1️⃣ RECIBO OFERTA → RESPONDO
                    if (datos.oferta && !conexion?.remoteDescription) {
                        console.log('📥 Recibí oferta');
                        crearConexion();
                        await conexion.setRemoteDescription(new RTCSessionDescription(datos.oferta));
                        const respuesta = await conexion.createAnswer({
                            offerToReceiveAudio: true,
                            offerToReceiveVideo: true
                        });
                        await conexion.setLocalDescription(respuesta);
                        señalesRef.update({ respuesta: respuesta });
                        console.log('📤 Envié respuesta');
                    }

                    // 2️⃣ RECIBO RESPUESTA → LA APLICO
                    if (datos.respuesta && conexion?.localDescription?.type === 'offer') {
                        console.log('📥 Recibí respuesta');
                        await conexion.setRemoteDescription(new RTCSessionDescription(datos.respuesta));
                    }

                    // 3️⃣ RECIBO DIRECCIONES → LAS AGREGO
                    if (datos.candidato && conexion) {
                        try {
                            await conexion.addIceCandidate(new RTCIceCandidate(datos.candidato));
                        } catch (e) {}
                    }
                } catch (e) {
                    console.error('Error señal:', e);
                }
            });

            // Escuchar mensajes del chat
            mensajesRef.on('child_added', (snap) => {
                const msg = snap.val();
                if (!msg.visto) {
                    mostrarMensaje(msg);
                    snap.ref.update({ visto: true });
                }
            });

            agregarMsgSistema(`✅ ${miRol === 'profesor' ? 'Profesor' : 'Alumno'} se ha conectado`);
        }

        function actualizarEstado(estado) {
            const barra = document.getElementById('barraEstado');
            if (estado === 'conectado') {
                barra.className = 'barra-estado estado-conectado';
                barra.textContent = `🟢 ${otroId === 'alumno' ? 'Alumno' : 'Profesor'} está conectado — ¡Activa tu cámara!`;
            } else {
                barra.className = 'barra-estado estado-esperando';
                barra.textContent = `⏳ Esperando que se conecte el ${otroId === 'alumno' ? 'Alumno' : 'Profesor'}...`;
            }
        }

        // ===== CREAR CONEXIÓN WEBRTC =====
        function crearConexion() {
            if (conexion) return;

            console.log('🔌 Creando conexión...');
            conexion = new RTCPeerConnection(servidoresICE);

            // 📹🎤 RECIBO VIDEO Y AUDIO DEL OTRO → LO MUESTRO
            conexion.ontrack = (evento) => {
                console.log(`📡 Recibí: ${evento.track.kind}`);
                
                if (evento.track.kind === 'video') {
                    const videoRemoto = document.getElementById('videoOtro');
                    videoRemoto.classList.remove('sin-video');
                    videoRemoto.srcObject = evento.streams[0];
                    document.getElementById('estadoConexionVideo').textContent = '🟢 ¡Cámara del otro visible!';
                    agregarMsgSistema('📹 ¡Cámara conectada! Ya se ven mutuamente');
                }
                
                if (evento.track.kind === 'audio') {
                    const audio = new Audio();
                    audio.srcObject = evento.streams[0];
                    audio.autoplay = true;
                    audio.volume = 1.0;
                    document.getElementById('audioOtroEstado').className = 'indicador activo';
                    document.getElementById('audioOtroEstado').textContent = '🔊 Audio activo';
                    agregarMsgSistema('🎤 ¡Audio conectado! Ya pueden escucharse');
                }
            };

            // 📡 COMPARTIR MI INFORMACIÓN
            conexion.onicecandidate = (evento) => {
                if (evento.candidate) {
                    señalesRef.child('candidato').set(evento.candidate.toJSON());
                }
            };

            // 🔄 SEGUIMIENTO DE ESTADO
            conexion.onconnectionstatechange = () => {
                const estado = conexion.connectionState;
                console.log('🔄 Estado:', estado);
                
                if (estado === 'connected') {
                    document.getElementById('estadoConexionVideo').textContent = '🟢 ¡Conectado completamente!';
                } else if (estado === 'connecting') {
                    document.getElementById('estadoConexionVideo').textContent = '🟡 Conectando...';
                } else if (estado === 'disconnected' || estado === 'failed') {
                    document.getElementById('estadoConexionVideo').textContent = '🔴 Conexión perdida — refresca y vuelve a entrar';
                }
            };

            // Si ya tengo mi stream → lo agrego
            if (miStream) {
                miStream.getTracks().forEach(pista => {
                    conexion.addTrack(pista, miStream);
                });
            }
        }

        // 📷🎤 ACTIVAR CÁMARA + MICRÓFONO
        async function iniciarCamaraAudio() {
            try {
                console.log('🎥 Solicitando cámara y micrófono...');
                
                miStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 1280, height: 720 },
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                // Mostrar mi cámara
                document.getElementById('miVideo').srcObject = miStream;
                document.getElementById('miAudioEstado').className = 'indicador activo';
                document.getElementById('miAudioEstado').textContent = '🎤 Mic: activo';
                
                agregarMsgSistema('📷🎤 Cámara y micrófono activados');

                // Crear conexión y agregar mi video + audio
                crearConexion();
                miStream.getTracks().forEach(pista => {
                    conexion.addTrack(pista, miStream);
                });

                // ⚡ LÓGICA CLAVE: El que llega SEGUNDO INICIA la conexión
                estadoRef.child(otroId).once('value', async (snap) => {
                    const otroConectado = snap.exists() && snap.val()?.conectado;
                    
                    // Si soy ALUMNO o el otro ya está conectado → YO INICIO
                    if ((miId === 'alumno' || otroConectado) && !yaOfreci) {
                        await crearYEnviarOferta();
                    }
                });

            } catch (e) {
                console.error('Error cámara/mic:', e);
                alert('❌ Error: ' + e.message + '\n⚠️ Da permiso a CÁMARA y MICRÓFONO cuando te lo pida.');
            }
        }

        // 📤 ENVIAR OFERTA DE CONEXIÓN
        async function crearYEnviarOferta() {
            if (yaOfreci) return;
            yaOfreci = true;

            console.log('📤 Enviando oferta...');
            crearConexion();
            const oferta = await conexion.createOffer({
                offerToReceiveAudio: true,
                offerToReceiveVideo: true
            });
            await conexion.setLocalDescription(oferta);
            await señalesRef.child('oferta').set(oferta.toJSON());
            document.getElementById('estadoConexionVideo').textContent = '📤 Enviando solicitud de conexión...';
        }

        // 🔇 SILENCIAR / ACTIVAR MICRÓFONO
        function alternarMicrofono() {
            if (!miStream) return;
            microfonoSilenciado = !microfonoSilenciado;
            const pistaAudio = miStream.getAudioTracks()[0];
            if (pistaAudio) pistaAudio.enabled = !microfonoSilenciado;
            
            const btn = document.getElementById('btnSilenciar');
            const indicador = document.getElementById('miAudioEstado');
            
            if (microfonoSilenciado) {
                btn.textContent = '🔊 Activar Mic';
                btn.className = 'btn btn-verde';
                indicador.textContent = '🎤 Mic: silenciado';
                indicador.className = 'indicador';
                agregarMsgSistema('🔇 Micrófono silenciado');
            } else {
                btn.textContent = '🔇 Silenciar';
                btn.className = 'btn btn-gris';
                indicador.textContent = '🎤 Mic: activo';
                indicador.className = 'indicador activo';
                agregarMsgSistema('🔊 Micrófono activado');
            }
        }

        // 🖥️ COMPARTIR PANTALLA
        async function compartirPantalla() {
            try {
                if (compartiendoPantalla) { detenerPantalla(); return; }
                const pantalla = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                document.getElementById('miVideo').srcObject = pantalla;
                compartiendoPantalla = true;

                if (conexion) {
                    const emisor = conexion.getSenders().find(s => s.track?.kind === 'video');
                    if (emisor) await emisor.replaceTrack(pantalla.getVideoTracks()[0]);
                }

                agregarMsgSistema('🖥️ Pantalla compartida');
                pantalla.getVideoTracks()[0].onended = detenerPantalla;
            } catch (e) { alert('❌ No se pudo compartir pantalla: ' + e.message); }
        }

        async function detenerPantalla() {
            compartiendoPantalla = false;
            if (miStream) {
                document.getElementById('miVideo').srcObject = miStream;
                if (conexion) {
                    const emisor = conexion.getSenders().find(s => s.track?.kind === 'video');
                    if (emisor) await emisor.replaceTrack(miStream.getVideoTracks()[0]);
                }
            }
            agregarMsgSistema('🖥️ Pantalla dejada de compartir');
        }

        function detenerTodo() {
            if (miStream) miStream.getTracks().forEach(t => t.stop());
            miStream = null;
            document.getElementById('miVideo').srcObject = null;
            document.getElementById('videoOtro').srcObject = null;
            document.getElementById('videoOtro').classList.add('sin-video');
            if (conexion) conexion.close();
            conexion = null;
            yaOfreci = false;
            microfonoSilenciado = false;
            agregarMsgSistema('🛑 Todo detenido');
        }

        // 💬 CHAT
        function enviarMensaje() {
            const texto = document.getElementById('entradaMensaje').value.trim();
            if (!texto) return;
            const hora = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
            mensajesRef.push({ de: miId, texto: texto, hora: hora, visto: false });
            document.getElementById('entradaMensaje').value = '';
        }

        function mostrarMensaje(msg) {
            const caja = document.getElementById('cajaMensajes');
            const esMio = msg.de === miId;
            const div = document.createElement('div');
            div.className = `mensaje ${esMio ? 'mensaje-propio' : 'mensaje-otro'}`;
            div.innerHTML = `<strong>${msg.de === 'profesor' ? '👨‍🏫 Profesor' : '👨‍🎓 Alumno'}:</strong> ${msg.texto}<div style="font-size:11px;opacity:0.7;margin-top:5px;">${msg.hora}</div>`;
            caja.appendChild(div);
            caja.scrollTop = caja.scrollHeight;
        }

        function agregarMsgSistema(texto) {
            const caja = document.getElementById('cajaMensajes');
            const div = document.createElement('div');
            div.style.textAlign = 'center';
            div.style.color = '#888';
            div.style.fontSize = '13px';
            div.style.margin = '8px 0';
            div.textContent = `— ${texto} —`;
            caja.appendChild(div);
            caja.scrollTop = caja.scrollHeight;
        }

        function salir() {
            if (confirm('¿Seguro quieres salir?')) {
                detenerTodo();
                estadoRef?.child(miId)?.set({ conectado: false });
                window.location.reload();
            }
        }
    </script>
</body>
</html>

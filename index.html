<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clase en Vivo — ¡SE VEN Y SE ESCUCHAN!</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #1a1a2e; color: white; min-height: 100vh; padding: 20px; }
        h1 { text-align: center; margin-bottom: 30px; color: #00f5d4; }

        /* PANTALLA DE INICIO */
        .pantalla-inicio { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; gap: 30px; }
        .caja-inicio { background: #16213e; border-radius: 16px; padding: 40px; width: 380px; box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
        .caja-inicio h2 { text-align: center; margin-bottom: 25px; color: #00f5d4; }
        .caja-inicio label { display: block; margin-bottom: 8px; font-weight: bold; color: #ccc; }
        .caja-inicio input { width: 100%; padding: 14px; border-radius: 8px; border: none; background: #0f3460; color: white; font-size: 16px; margin-bottom: 25px; }
        .botones-rol { display: flex; gap: 15px; }
        .btn { padding: 16px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.3s; flex: 1; }
        .btn-profesor { background: #ffd700; color: #000; }
        .btn-profesor:hover { background: #e6c200; transform: scale(1.05); }
        .btn-alumno { background: #00f5d4; color: #000; }
        .btn-alumno:hover { background: #00d4b8; transform: scale(1.05); }

        /* PANTALLA DE CLASE */
        .pantalla-clase { display: none; }
        .nombre-sesion { text-align: center; font-size: 20px; margin-bottom: 15px; padding: 10px; background: #16213e; border-radius: 8px; }
        .barra-estado { text-align: center; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; font-size: 16px; }
        .estado-esperando { background: #5c4a00; color: #fff; }
        .estado-conectando { background: #1976d2; color: #fff; }
        .estado-conectado { background: #004d40; color: #fff; }
        .grid-video { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .caja-video { background: #16213e; border-radius: 12px; padding: 20px; }
        .etiqueta-nombre { font-size: 18px; font-weight: bold; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; }
        .etiqueta-profesor { background: #ffd700; color: #000; }
        .etiqueta-alumno { background: #00f5d4; color: #000; }
        video { width: 100%; border-radius: 8px; background: #000; min-height: 300px; margin-bottom: 10px; }
        #videoLocal { transform: scaleX(-1); }
        #videoRemoto { transform: none; }
        .indicadores { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .indicador { padding: 8px 14px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        .ind-activo { background: #004d40; color: white; }
        .ind-espera { background: #444; color: #aaa; }
        .btn-salir { position: fixed; top: 15px; right: 15px; background: #e94560; color: white; z-index: 100; padding: 12px 20px; }
        .caja-chat { background: #16213e; border-radius: 12px; padding: 20px; margin-top: 20px; }
        .mensajes { height: 180px; overflow-y: auto; background: #0f3460; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .mensaje { margin-bottom: 10px; padding: 10px; border-radius: 12px; max-width: 85%; }
        .mensaje-mio { background: #00f5d4; color: #000; margin-left: auto; }
        .mensaje-otro { background: #2a3f5f; color: white; margin-right: auto; }
        .mensaje-sistema { background: #2a2a4a; color: #aaa; font-size: 13px; text-align: center; }
        .entrada-chat { display: flex; gap: 10px; }
        .entrada-chat input { flex: 1; padding: 14px; border-radius: 8px; border: none; background: #0f3460; color: white; font-size: 15px; }
        @media (max-width: 850px) { .grid-video { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <button class="btn btn-salir" onclick="salir()">🚪 Salir</button>

    <!-- PANTALLA DE INICIO -->
    <div class="pantalla-inicio" id="pantallaInicio">
        <h1>📹🎤 Clase en Vivo</h1>
        <div class="caja-inicio">
            <h2>👤 Ingresa tus datos</h2>
            <label for="inputNombre">Tu Nombre:</label>
            <input type="text" id="inputNombre" placeholder="Escribe tu nombre aquí..." autocomplete="off">
            <div class="botones-rol">
                <button class="btn btn-profesor" onclick="entrar('profesor')">👨‍🏫 Profesor</button>
                <button class="btn btn-alumno" onclick="entrar('alumno')">👨‍🎓 Alumno</button>
            </div>
        </div>
    </div>

    <!-- PANTALLA DE CLASE -->
    <div class="pantalla-clase" id="pantallaClase">
        <h1>📹🎤 Clase en Vivo</h1>
        <div class="nombre-sesion" id="nombreSesion">Conectado como: —</div>
        <div class="barra-estado estado-esperando" id="barraEstado">⏳ Iniciando cámara y micrófono...</div>

        <div class="grid-video">
            <div class="caja-video">
                <div class="etiqueta-nombre" id="etiquetaLocal">Tu Cámara</div>
                <div class="indicadores">
                    <div class="indicador ind-espera" id="indCamaraLocal">📷 Cámara: INICIANDO</div>
                    <div class="indicador ind-espera" id="indMicroLocal">🎤 Mic: INICIANDO</div>
                </div>
                <video id="videoLocal" autoplay playsinline muted></video>
            </div>
            <div class="caja-video">
                <div class="etiqueta-nombre" id="etiquetaRemota">Esperando...</div>
                <div class="indicadores">
                    <div class="indicador ind-espera" id="indCamaraRemota">📷 Cámara: —</div>
                    <div class="indicador ind-espera" id="indMicroRemota">🔊 Audio: —</div>
                </div>
                <video id="videoRemoto" autoplay playsinline></video>
            </div>
        </div>

        <div class="caja-chat">
            <h2>💬 Chat</h2>
            <div class="mensajes" id="cajaMensajes">
                <div class="mensaje-sistema">✅ Bienvenido. La cámara y el micrófono se activan solos.</div>
            </div>
            <div class="entrada-chat">
                <input type="text" id="inputChat" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter') enviarChat()">
                <button class="btn btn-profesor" onclick="enviarChat()">📤 Enviar</button>
            </div>
        </div>
    </div>

    <script>
        // FIREBASE — YA CONFIGURADO
        const firebaseConfig = {
            apiKey: "AIZaSyCFWxrLP77QblShCdUvjuDbg-X98yfyAo",
            authDomain: "clases-consupervision.firebaseapp.com",
            projectId: "clases-consupervision",
            storageBucket: "clases-consupervision.appspot.com",
            messagingSenderId: "125682581947",
            appId: "1:125682581947:web:e93e303b30b6979924849e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // SERVIDORES STUN — NECESARIOS PARA CONECTAR
        const CONFIG_ICE = { iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:stun1.l.google.com:19302" },
            { urls: "stun:stun2.l.google.com:19302" },
            { urls: "stun:stun3.l.google.com:19302" }
        ]};

        // VARIABLES GLOBALES
        let miRol, miNombre, miId, otroId, otroNombre;
        let conexionWebRTC = null;
        let streamLocalVideo = null;
        let streamLocalAudio = null;
        let conexionLista = false;
        let yaOfrecí = false;
        const RUTA = 'sala_unica_01';

        // 🟢 FUNCIÓN PRINCIPAL — ENTRAR A LA CLASE
        async function entrar(rol) {
            miNombre = document.getElementById('inputNombre').value.trim();
            if (!miNombre) { alert('⚠️ Escribe tu nombre primero'); document.getElementById('inputNombre').focus(); return; }

            miRol = rol;
            miId = rol;
            otroId = rol === 'profesor' ? 'alumno' : 'profesor';

            // CAMBIAR PANTALLAS
            document.getElementById('pantallaInicio').style.display = 'none';
            document.getElementById('pantallaClase').style.display = 'block';
            document.getElementById('nombreSesion').textContent = `👤 ${miNombre} — ${rol === 'profesor' ? 'Profesor' : 'Alumno'}`;
            document.getElementById('etiquetaLocal').textContent = `${miNombre} (TÚ)`;
            document.getElementById('etiquetaLocal').className = `etiqueta-nombre ${rol === 'profesor' ? 'etiqueta-profesor' : 'etiqueta-alumno'}`;
            document.getElementById('etiquetaRemota').className = `etiqueta-nombre ${otroId === 'profesor' ? 'etiqueta-profesor' : 'etiqueta-alumno'}`;
            document.getElementById('etiquetaRemota').textContent = `Esperando a ${otroId === 'profesor' ? 'Profesor' : 'Alumno'}...`;

            // 🎯 PASO 1: ACTIVAR CÁMARA Y MICRÓFONO — LO PRIMERO QUE SE HACE
            await activarCamaraYMic();

            // 🎯 PASO 2: INICIALIZAR CONEXIÓN BASE DE DATOS
            inicializarBaseDatos();
        }

        // 🎥 ACTIVAR CÁMARA Y MICRÓFONO — GARANTIZADO ANTES DE CONECTAR
        async function activarCamaraYMic() {
            try {
                console.log('📷 Solicitando cámara...');
                streamLocalVideo = await navigator.mediaDevices.getUserMedia({
                    video: { width: 1280, height: 720, facingMode: 'user' }
                });
                document.getElementById('videoLocal').srcObject = streamLocalVideo;
                document.getElementById('indCamaraLocal').className = 'indicador ind-activo';
                document.getElementById('indCamaraLocal').textContent = '📷 CÁMARA: ACTIVA ✅';
                console.log('✅ Cámara activada');
            } catch (e) {
                console.error('❌ Error cámara:', e);
                alert('❌ No se pudo acceder a la CÁMARA. Da permiso y recarga la página.');
                return;
            }

            try {
                console.log('🎤 Solicitando micrófono...');
                streamLocalAudio = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });
                document.getElementById('indMicroLocal').className = 'indicador ind-activo';
                document.getElementById('indMicroLocal').textContent = '🎤 MIC: ACTIVO ✅';
                console.log('✅ Micrófono activado');
            } catch (e) {
                console.error('❌ Error micrófono:', e);
                alert('❌ No se pudo acceder al MICRÓFONO. Da permiso y recarga la página.');
                return;
            }

            actualizarEstado('esperando', '✅ Cámara y micrófono listos — esperando al otro...');
        }

        // 📊 INICIALIZAR BASE DE DATOS Y ESCUCHAR
        function inicializarBaseDatos() {
            const estadoRef = db.ref(`${RUTA}/estado`);
            const señalesRef = db.ref(`${RUTA}/señales`);
            const chatRef = db.ref(`${RUTA}/chat`);

            // DECIR QUE ESTOY CONECTADO
            estadoRef.child(miId).set({ conectado: true, nombre: miNombre, hora: Date.now() });

            // ESCUCHAR SI EL OTRO SE CONECTA
            estadoRef.child(otroId).on('value', async (snap) => {
                const datos = snap.val();
                if (datos && datos.conectado) {
                    otroNombre = datos.nombre || (otroId === 'profesor' ? 'Profesor' : 'Alumno');
                    document.getElementById('etiquetaRemota').textContent = `${otroNombre} (OTRO)`;
                    actualizarEstado('conectando', `🟡 ${otroNombre} está conectado — estableciendo conexión...`);

                    // SI SOY ALUMNO → INICIO LA CONEXIÓN
                    if (miId === 'alumno' && !yaOfrecí) {
                        await iniciarConexionWebRTC();
                    }
                } else {
                    document.getElementById('etiquetaRemota').textContent = `Esperando a ${otroId === 'profesor' ? 'Profesor' : 'Alumno'}...`;
                    otroNombre = null;
                    actualizarEstado('esperando', `⏳ Esperando que se conecte ${otroId === 'profesor' ? 'el Profesor' : 'el Alumno'}...`);
                }
            });

            // 📡 ESCUCHAR SEÑALES DE CONEXIÓN
            señalesRef.on('value', async (snap) => {
                const datos = snap.val();
                if (!datos) return;

                try {
                    // 📥 RECIBÍ UNA OFERTA → RESPONDO
                    if (datos.oferta && !conexionWebRTC?.remoteDescription) {
                        crearConexionWebRTC(); // ✅ YA TENGO CÁMARA Y MIC LISTOS
                        await conexionWebRTC.setRemoteDescription(new RTCSessionDescription(datos.oferta));
                        const respuesta = await conexionWebRTC.createAnswer({
                            offerToReceiveAudio: true,
                            offerToReceiveVideo: true
                        });
                        await conexionWebRTC.setLocalDescription(respuesta);
                        señalesRef.update({ respuesta: respuesta });
                        console.log('📤 Respuesta enviada');
                        agregarMensajeSistema(`📡 Conectando con ${otroNombre || 'el otro'}...`);
                    }

                    // 📥 RECIBÍ UNA RESPUESTA
                    if (datos.respuesta && conexionWebRTC?.localDescription?.type === 'offer') {
                        await conexionWebRTC.setRemoteDescription(new RTCSessionDescription(datos.respuesta));
                        console.log('✅ Respuesta recibida');
                    }

                    // 📡 RECIBÍ UN CANDIDATO
                    if (datos.candidato && conexionWebRTC) {
                        try {
                            await conexionWebRTC.addIceCandidate(new RTCIceCandidate(datos.candidato));
                        } catch (e) { console.log('⚠️ Candidato omitido'); }
                    }
                } catch (e) { console.error('❌ Error señal:', e); }
            });

            // 💬 ESCUCHAR MENSAJES DEL CHAT
            chatRef.limitToLast(50).on('child_added', (snap) => {
                const msg = snap.val();
                if (!msg || msg.de === miId) return;
                mostrarMensajeRecibido(msg);
            });

            agregarMensajeSistema(`✅ ${miNombre} está listo`);
        }

        // 🔗 CREAR LA CONEXIÓN WEB RTC
        function crearConexionWebRTC() {
            if (conexionWebRTC) return;
            console.log('🔗 Creando conexión WebRTC...');

            conexionWebRTC = new RTCPeerConnection(CONFIG_ICE);

            // 📹🎤 RECIBIR VIDEO Y AUDIO DEL OTRO — ¡LO MÁS IMPORTANTE!
            conexionWebRTC.ontrack = (evento) => {
                console.log(`📡 Recibí pista: ${evento.track.kind}`);
                if (evento.track.kind === 'video') {
                    const videoRemoto = document.getElementById('videoRemoto');
                    videoRemoto.srcObject = evento.streams[0];
                    document.getElementById('indCamaraRemota').className = 'indicador ind-activo';
                    document.getElementById('indCamaraRemota').textContent = `📷 ${otroNombre || 'OTRO'}: ACTIVA ✅`;
                    actualizarEstado('conectado', `🟢 ¡${otroNombre || 'LA OTRA PERSONA'} ESTÁ VISIBLE! 🎉`);
                    agregarMensajeSistema(`📹 Ahora ves a ${otroNombre || 'la otra persona'} ✅`);
                }
                if (evento.track.kind === 'audio') {
                    const audio = new Audio();
                    audio.srcObject = evento.streams[0];
                    audio.autoplay = true;
                    audio.volume = 1.0;
                    document.getElementById('indMicroRemota').className = 'indicador ind-activo';
                    document.getElementById('indMicroRemota').textContent = `🔊 ESCUCHANDO ✅`;
                    agregarMensajeSistema(`🎤 Ahora escuchas a ${otroNombre || 'la otra persona'} ✅`);
                }
            };

            // 📡 ENVIAR MIS DATOS DE CONEXIÓN
            conexionWebRTC.onicecandidate = (e) => {
                if (e.candidate) {
                    db.ref(`${RUTA}/señales/candidato`).set(e.candidate.toJSON());
                }
            };

            // 🔄 ESTADO DE LA CONEXIÓN
            conexionWebRTC.onconnectionstatechange = () => {
                const estado = conexionWebRTC.connectionState;
                console.log(`🔄 Estado conexión: ${estado}`);
                if (estado === 'connected') {
                    actualizarEstado('conectado', `🟢 ¡CONECTADO COMPLETAMENTE CON ${otroNombre || 'LA OTRA PERSONA'}! 🎉`);
                    agregarMensajeSistema('🎉 ¡CONEXIÓN ESTABLECIDA! Se ven y se escuchan ✅');
                    conexionLista = true;
                } else if (estado === 'connecting') {
                    actualizarEstado('conectando', '🟡 Conectando flujos de video y audio...');
                } else if (estado === 'disconnected' || estado === 'failed') {
                    actualizarEstado('esperando', '🔴 Conexión perdida — recarga y vuelve a entrar');
                    conexionLista = false;
                }
            };

            // ✅ ENVIAR MI CÁMARA Y MICRÓFONO AL OTRO — ¡ANTES DE CONECTAR!
            if (streamLocalVideo) {
                streamLocalVideo.getTracks().forEach(pista => {
                    console.log('➕ Enviando mi video al otro');
                    conexionWebRTC.addTrack(pista, streamLocalVideo);
                });
            }
            if (streamLocalAudio) {
                streamLocalAudio.getTracks().forEach(pista => {
                    console.log('➕ Enviando mi audio al otro');
                    conexionWebRTC.addTrack(pista, streamLocalAudio);
                });
            }
        }

        // 📤 INICIAR CONEXIÓN — SOLO LO HACE EL ALUMNO
        async function iniciarConexionWebRTC() {
            if (yaOfrecí) return;
            yaOfrecí = true;
            crearConexionWebRTC();
            const oferta = await conexionWebRTC.createOffer({
                offerToReceiveAudio: true,
                offerToReceiveVideo: true
            });
            await conexionWebRTC.setLocalDescription(oferta);
            await db.ref(`${RUTA}/señales/oferta`).set(oferta.toJSON());
            console.log('📤 Oferta enviada');
            actualizarEstado('conectando', `📤 Enviando solicitud a ${otroNombre || 'el Profesor'}...`);
            agregarMensajeSistema(`📤 Solicitud de conexión enviada a ${otroNombre || 'el Profesor'}`);
        }

        // 📊 ACTUALIZAR BARRA DE ESTADO
        function actualizarEstado(tipo, texto) {
            const barra = document.getElementById('barraEstado');
            barra.textContent = texto;
            barra.className = `barra-estado estado-${tipo}`;
        }

        // 💬 MENSAJES DEL CHAT
        function enviarChat() {
            const texto = document.getElementById('inputChat').value.trim();
            if (!texto) return;
            const hora = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
            const mensaje = { de: miId, nombre: miNombre, texto: texto, hora: hora };
            db.ref(`${RUTA}/chat`).push(mensaje);
            const caja = document.getElementById('cajaMensajes');
            const div = document.createElement('div');
            div.className = 'mensaje mensaje-mio';
            div.innerHTML = `<strong>${miNombre}:</strong> ${texto}<div style="font-size:11px;opacity:0.7;text-align:right;">${hora}</div>`;
            caja.appendChild(div);
            caja.scrollTop = caja.scrollHeight;
            document.getElementById('inputChat').value = '';
        }

        function mostrarMensajeRecibido(msg) {
            const caja = document.getElementById('cajaMensajes');
            const div = document.createElement('div');
            div.className = 'mensaje mensaje-otro';
            div.innerHTML = `<strong>${msg.nombre || 'Otro'}:</strong> ${msg.texto}<div style="font-size:11px;opacity:0.7;">${msg.hora}</div>`;
            caja.appendChild(div);
            caja.scrollTop = caja.scrollHeight;
        }

        function agregarMensajeSistema(texto) {
            const caja = document.getElementById('cajaMensajes');
            const div = document.createElement('div');
            div.className = 'mensaje mensaje-sistema';
            div.textContent = `— ${texto} —`;
            caja.appendChild(div);
            caja.scrollTop = caja.scrollHeight;
        }

        // 🚪 SALIR
        function salir() {
            if (confirm('¿Seguro quieres salir?')) {
                if (streamLocalVideo) streamLocalVideo.getTracks().forEach(t => t.stop());
                if (streamLocalAudio) streamLocalAudio.getTracks().forEach(t => t.stop());
                if (conexionWebRTC) conexionWebRTC.close();
                db.ref(`${RUTA}/estado/${miId}`).set({ conectado: false, nombre: miNombre });
                db.ref(`${RUTA}/señales`).remove();
                window.location.reload();
            }
        }
    </script>
</body>
</html>
